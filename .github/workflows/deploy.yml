name: Deploy Flatsome Child Theme to 1Panel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: 🚀 Auto Deploy via FTP/SFTP
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📤 Sync files to Server via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          server-dir: ${{ secrets.FTP_TARGET_DIR || 'domains/vinhphucvinfast.com/wp-content/themes/flatsome-child/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/__pycache__/**
            **/AGENTS.md
            **/README.md
